name: Release

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check sources
        run: |
          node --check src/extension.js
          node --check src/commands.js

      - name: Package extension
        run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" ./*.vsix \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
